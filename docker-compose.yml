# =============================================================================
# Open WebUI — Docker Compose for RKLLM API Server (Orange Pi 5 Plus)
# =============================================================================
#
# All optimized settings are hardcoded as environment variables below.
# These serve as correct defaults for fresh installs or config resets.
# Once changed in the Admin UI, the database value takes precedence
# (PersistentConfig). Delete the Docker volume to re-apply env vars.
#
# USAGE:
#   docker compose up -d          # Start
#   docker compose down            # Stop
#   docker compose pull && docker compose up -d   # Update image
#   docker compose down -v         # Reset (deletes all data + settings)
#
# =============================================================================

services:
  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # -----------------------------------------------------------------
      # Connection — RKLLM API Server (NPU models)
      # -----------------------------------------------------------------
      - OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - OPENAI_API_KEY=sk-unused

      # -----------------------------------------------------------------
      # RAG Pipeline
      # -----------------------------------------------------------------
      # Embedding & Reranking
      - RAG_EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RAG_RERANKING_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      - RAG_EMBEDDING_BATCH_SIZE=10
      - ENABLE_ASYNC_EMBEDDING=True

      # Retrieval tuning
      - RAG_SYSTEM_CONTEXT=True
      - RAG_TOP_K=5
      - RAG_TOP_K_RERANKER=3
      - RAG_RELEVANCE_THRESHOLD=0.0
      - ENABLE_RAG_HYBRID_SEARCH=True
      - ENABLE_RAG_HYBRID_SEARCH_ENRICHED_TEXTS=True
      - RAG_HYBRID_BM25_WEIGHT=0.1

      # Chunking
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=0
      - CHUNK_MIN_SIZE_TARGET=400
      - ENABLE_MARKDOWN_HEADER_TEXT_SPLITTER=True

      # Query generation (API server shortcircuits this — ~0ms)
      - ENABLE_RETRIEVAL_QUERY_GENERATION=True

      # Custom RAG prompt template
      - |
        RAG_TEMPLATE=### Task:
        Answer the user's question using ONLY the provided context. Be thorough and detailed.

        ### Guidelines:
        - If the answer is in the context, provide a comprehensive response with all relevant details.
        - If the context doesn't contain the answer, say so clearly.
        - Respond in the same language as the user's query.
        - Do not use XML tags in your response.

        <context>
        {{CONTEXT}}
        </context>

        <user_query>
        {{QUERY}}
        </user_query>

      # -----------------------------------------------------------------
      # Web Search (SearXNG)
      # -----------------------------------------------------------------
      - ENABLE_WEB_SEARCH=True
      - ENABLE_WEB_SEARCH_DEFAULT=False        # Globe is OFF by default — user enables per-query
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://host.docker.internal:8080/search?q=<query>
      - WEB_SEARCH_RESULT_COUNT=5
      - WEB_SEARCH_CONCURRENT_REQUESTS=1      # Prevents simultaneous requests that trigger rate limits
      - BYPASS_WEB_SEARCH_WEB_LOADER=True
      - BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL=True

      # -----------------------------------------------------------------
      # File Upload / Image Compression
      # -----------------------------------------------------------------
      # 672x672 matches the active VL encoder resolution (Qwen3-VL-2B)
      # Other available resolutions: 448 (faster, less detail), 896 (slower, more detail)
      - FILE_IMAGE_COMPRESSION_WIDTH=672
      - FILE_IMAGE_COMPRESSION_HEIGHT=672

      # -----------------------------------------------------------------
      # Document Processing (RAG)
      # -----------------------------------------------------------------
      # OCR images embedded in PDFs (uses Tesseract inside the container)
      - PDF_EXTRACT_IMAGES=True

      # -----------------------------------------------------------------
      # Code Execution & Interpreter — OFF
      # -----------------------------------------------------------------
      # Small NPU models (1.7B–4B) generate unreliable code; running it
      # wastes time or produces wrong results. Disable both features.
      - ENABLE_CODE_EXECUTION=False
      - ENABLE_CODE_INTERPRETER=False

      # -----------------------------------------------------------------
      # Task Model — Qwen3 1.7B handles all background LLM tasks
      # (title gen, tags, follow-up, compaction, query rewriting)
      # -----------------------------------------------------------------
      - TASK_MODEL=qwen3-1.7b

      # -----------------------------------------------------------------
      # Context Compaction
      # -----------------------------------------------------------------
      # Fires at 3000 tokens — suits small models (1.7B/4B have 4-16K context).
      # Compaction runs on Qwen3 1.7B rather than the active chat model.
      - ENABLE_CONTEXT_COMPACTION=True
      - CONTEXT_COMPACTION_MODEL=qwen3-1.7b
      - CONTEXT_COMPACTION_TOKEN_THRESHOLD=3000
      - CONTEXT_COMPACTION_TOKEN_CAP=32000
      - CONTEXT_COMPACTION_RETENTION_PERCENTAGE=30

      # -----------------------------------------------------------------
      # Background Generation Tasks — OFF
      # Each fires a separate LLM call on the single NPU, adding latency
      # and risking 503 collisions. None are useful enough to justify the cost.
      # -----------------------------------------------------------------
      # Tags: auto-labels every chat from content — not worth an NPU call
      - ENABLE_TAGS_GENERATION=False
      # Follow-up: suggests next questions after every response — NPU waste
      - ENABLE_FOLLOW_UP_GENERATION=False
      # Autocomplete: fires on every keystroke while typing — most expensive
      - ENABLE_AUTOCOMPLETE_GENERATION=False

      # Title generation stays ON: fires once per new chat, at a natural
      # pause after the first response. Low cost, high UX value.
      - ENABLE_TITLE_GENERATION=True

      # -----------------------------------------------------------------
      # Custom Prompts
      # -----------------------------------------------------------------
      # Query generation (shared for web search + RAG retrieval):
      # Default prompt is 200+ words — small models add commentary before
      # the JSON which breaks parsing. This stripped-down version is reliable.
      - |
        QUERY_GENERATION_PROMPT_TEMPLATE=Generate 1-3 web search queries to find information needed to answer the question.
        Today: {{CURRENT_DATE}}
        Return ONLY JSON, no other text: { "queries": ["query1", "query2"] }
        If no search is needed: { "queries": [] }
        <chat_history>
        {{MESSAGES:END:6}}
        </chat_history>

      # Context compaction prompt: default is good but misses technical detail
      # preservation — critical for config/debugging sessions on this hardware.
      - |
        CONTEXT_COMPACTION_PROMPT_TEMPLATE=### Task:
        Summarize the conversation history that will be compacted out of the active chat context.

        ### Instructions:
        - Preserve key decisions, user preferences, and constraints.
        - Preserve files, artifacts, tool results, and code changes that matter going forward.
        - Preserve the current task state, unresolved questions, and next steps.
        - Preserve exact technical details: command syntax, file paths, IP addresses, model names, version numbers, error messages, and configuration values.
        - Be factual and specific. Do not invent details.
        - Keep the summary concise, but complete enough for the assistant to continue without the removed messages.

        ### Previous Summary:
        {{PREVIOUS_SUMMARY}}

        ### Messages Being Compacted:
        {{COMPACTED_MESSAGES}}

        ### Recent Messages Kept In Context:
        {{RECENT_MESSAGES}}

      # -----------------------------------------------------------------
      # Features
      # -----------------------------------------------------------------
      - ENABLE_CHANNELS=True
      - ENABLE_MEMORIES=True
      - ENABLE_NOTES=True

      # -----------------------------------------------------------------
      # Privacy
      # -----------------------------------------------------------------
      - ANONYMIZED_TELEMETRY=false
      - DO_NOT_TRACK=true

volumes:
  open-webui:
