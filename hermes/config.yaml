# =============================================================================
# Hermes Agent — configuration for RKLLM local API
# =============================================================================
# Docs: https://hermes-agent.nousresearch.com/docs
#
# This config points Hermes Agent at the local Qwen3 inference server
# (api.py on port 8000) and exposes an OpenAI-compatible gateway on
# port 8642 so OpenWebUI can use it as a selectable model.
# =============================================================================

# ---------------------------------------------------------------------------
# LLM backend — our local OpenAI-compatible API
# ---------------------------------------------------------------------------
providers:
  custom:
    base_url: "http://127.0.0.1:8000/v1"
    api_key: "na"
    request_timeout_seconds: 300

model:
  provider: "custom"
  model: "qwen3-4b"
  context_length: 131072     # override reported window — Hermes requires ≥64K

# ---------------------------------------------------------------------------
# Gateway / API server — exposes Hermes Agent to OpenWebUI on port 8642
# ---------------------------------------------------------------------------
api_server:
  enabled: true
  host: "0.0.0.0"            # bind all interfaces so OWUI (Docker) can reach it
  port: 8642
  key: "${HERMES_API_KEY}"   # set via hermes/.env or HERMES_API_KEY env var

# ---------------------------------------------------------------------------
# Toolsets — disable heavy tools so system prompt fits qwen3-4b's 16K context.
# With all toolsets enabled Hermes injects ~14,600 tokens (58K chars) which
# causes SIGSEGV crashes in RKLLM. Disabling these keeps the system prompt
# at ~2,500 tokens, leaving ~13K tokens for conversation.
# Use `agent.disabled_toolsets` (not the ignored `tools:` key).
# ---------------------------------------------------------------------------
agent:
  disabled_toolsets:
    - web
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - video
    - image_gen
    - video_gen
    - x_search
    - tts
    - skills
    - todo
    - session_search
    - clarify
    - delegation
    - cronjob
    - homeassistant
    - spotify
    - discord
    - discord_admin
    - yuanbao
    - computer_use
    - context_engine

# ---------------------------------------------------------------------------
# Memory — use built-in FTS5 full-text search (no embedding service needed)
# ---------------------------------------------------------------------------
memory:
  provider: "fts5"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_level: "INFO"
