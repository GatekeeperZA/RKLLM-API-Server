# =============================================================================
# SearXNG Settings — Optimized for Open WebUI on Orange Pi 5 Plus
# Docs: https://docs.searxng.org/admin/settings/settings.html
# =============================================================================
#
# INSTALL: Copy this file to ~/Downloads/searxng-docker/searxng/settings.yml
#          then restart:  cd ~/Downloads/searxng-docker && docker compose down && docker compose up -d
#
# ENGINE NOTES (updated 2026-08):
#   - Bing: scraper API retired Aug 11 2025 — returns garbage results, do NOT use
#   - DuckDuckGo: gets CAPTCHAed within hours on automated AI query volume — keep disabled
#   - Startpage: CAPTCHAed immediately, 1h suspension — do not use
#   - Mojeek: own crawl index, lowest block rate, best long-term primary engine
#   - Brave: own index, suspends ~3 min under burst load, recovers quickly
#   - Qwant: generally stable, occasional CAPTCHA under burst load
#   - mwmbl: non-profit, never blocks, smaller index — reliable fallback
#   - Wikipedia: always works, no rate limiting
#
# IMPORTANT: Many SearXNG engines are disabled: true in the bundled defaults.
# Using keep_only inherits those disabled flags — you MUST set disabled: false
# explicitly in the engines: section or engines will silently stay off.

use_default_settings:
  engines:
    keep_only:
      - mojeek
      - brave
      - qwant
      - mwmbl
      - wikipedia
      - duckduckgo

server:
  secret_key: "changeme-use-a-random-string"
  limiter: false              # No rate limiting (local-only API)
  image_proxy: false          # Not needed — Open WebUI fetches text only
  request_timeout: 10         # Max wait for all engines (seconds)

search:
  formats: [html, json]       # json REQUIRED for Open WebUI API access
  default_lang: en
  safe_search: 0              # 0=off, 1=moderate, 2=strict
  autocomplete: ""            # Disable — saves resources, not used by API

# Outgoing HTTP tuning — how SearXNG talks to search engines
outgoing:
  request_timeout: 8.0        # Per-engine timeout (must be < server timeout)
  max_request_timeout: 15.0   # Absolute ceiling for slow engines
  pool_connections: 100       # Connection pool size
  pool_maxsize: 20            # Max connections per host
  retries: 2                  # Retry on HTTP errors (uses next engine on retry)
  keepalive_expiry: 5.0

redis:
  url: redis://redis:6379/0

engines:
  - name: mojeek
    weight: 1.5
    shortcut: mj
    disabled: false           # Own independent index — lowest block rate
    categories: [general, web]
  - name: brave
    weight: 1.4
    shortcut: brave
    disabled: false           # Own index — good quality, moderate rate limits
    categories: [general, web]
  - name: qwant
    weight: 1.3
    shortcut: qw
    disabled: false           # French search engine — generally stable
    categories: [general, web]
  - name: mwmbl
    weight: 1.0
    shortcut: mw
    disabled: false           # Non-profit, bot-friendly, never blocks
    categories: [general, web]
  - name: wikipedia
    weight: 1.2
    shortcut: wp
    disabled: false           # Always reliable, no rate limiting
    categories: [general]
  - name: duckduckgo
    weight: 1.0
    shortcut: ddg
    disabled: true            # CAPTCHAed quickly on automated queries
    categories: [general, web] # Re-enable manually after 24-48h of no traffic if desired
